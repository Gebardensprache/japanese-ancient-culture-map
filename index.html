<!DOCTYPE html>
<html>
<head>
    <title>日本の古代文化マップ</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background-color: #72ff47; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .search-panel {
            position: absolute;
            top: 16px;
            right: 16px;
            left: auto;
            z-index: 1000;
            width: min(360px, calc(100vw - 32px));
            background: rgba(255, 255, 255, 0.94);
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
            padding: 14px;
            backdrop-filter: blur(8px);
        }
        .search-panel.hidden {
            display: none;
        }
        .search-panel h1 {
            margin: 0 0 10px;
            font-size: 18px;
            line-height: 1.3;
        }
        .search-panel input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #c8d3d9;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 15px;
            outline: none;
        }
        .search-panel input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }
        .results {
            margin-top: 10px;
            max-height: 240px;
            overflow: auto;
        }
        .results button {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            text-align: left;
            background: #f4f7f9;
            cursor: pointer;
        }
        .results button:hover {
            background: #e8f1ff;
        }
        .results button strong {
            display: block;
            margin-bottom: 4px;
        }
        .results-empty {
            margin: 0;
            color: #55626b;
            font-size: 14px;
        }
        .floating-action {
            position: absolute;
            right: 16px;
            z-index: 1000;
            width: 132px;
            box-sizing: border-box;
            border: 0;
            border-radius: 999px;
            padding: 12px 0;
            color: #fff;
            font-size: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .search-toggle {
            bottom: 16px;
            z-index: 1000;
            background: #1f2937;
        }
        .search-toggle:hover {
            background: #111827;
        }
        .random-button {
            bottom: 64px;
            background: #0f766e;
        }
        .random-button:hover {
            background: #115e59;
        }
        .info-panel {
            position: absolute;
            top: 88px;
            left: 20px;
            z-index: 1000;
            width: min(320px, calc(100vw - 40px));
            max-height: calc(100vh - 112px);
            overflow: auto;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
            padding: 12px;
            backdrop-filter: blur(8px);
        }
        .info-panel.hidden {
            display: none;
        }
        .info-panel-header {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        .info-panel-title {
            margin: 0;
            font-size: 18px;
            line-height: 1.3;
        }
        .info-panel-close {
            border: 0;
            background: transparent;
            color: #44515a;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
        }
        .info-panel-image {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 10px 0 12px;
            display: block;
        }
        .info-panel-body p {
            margin: 0 0 10px;
            line-height: 1.6;
            color: #1f2937;
        }
        .info-panel-body a {
            color: #0b66c3;
            text-decoration: underline;
        }
        #map { 
            height: 100vh; 
            width: 100%; 
            background-color: #aad3df; /* Sea colour */
        }
    </style>
</head>
<body>

<button id="randomButton" class="floating-action random-button" type="button">ランダム表示</button>
<button id="searchToggle" class="floating-action search-toggle" type="button">検索を表示</button>

<aside id="infoPanel" class="info-panel hidden" aria-live="polite">
    <div class="info-panel-header">
        <h1 id="infoTitle" class="info-panel-title"></h1>
        <button id="infoClose" class="info-panel-close" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="infoBody" class="info-panel-body"></div>
</aside>

<div id="searchPanel" class="search-panel hidden">
    <h1>検索</h1>
    <input id="searchInput" type="text" placeholder="日本語のキーワードで検索" autocomplete="off" />
    <div id="searchResults" class="results">
        <p class="results-empty">名前を入力すると候補を表示します。</p>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const oceanBlue = "#aad3df";

    // Initial Map
    const map = L.map('map', {
        center: [36.2, 138.2],
        zoom: 5,
        minZoom: 4,
        maxBounds: [[18, 118], [52, 155]], // Limit max bounds
        maxBoundsViscosity: 1.0
    });

    // 1. Load background layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // 2. Define world outer
    const worldOuter = [[90, -180], [-90, -180], [-90, 180], [90, 180], [90, -180]];

    // 3. Load japan.geojson from work dir
    fetch('./japan.geojson')
        .then(response => {
            if (!response.ok) throw new Error("japan.geojson ファイルが見つかりません。");
            return response.json();
        })
        .then(data => {
            let maskCoords = [worldOuter];

            data.features.forEach(feature => {
                const geometry = feature.geometry;
                if (geometry.type === 'Polygon') {
                    addToMask(geometry.coordinates, maskCoords);
                } else if (geometry.type === 'MultiPolygon') {
                    geometry.coordinates.forEach(poly => {
                        addToMask(poly, maskCoords);
                    });
                }
            });

            // 4. Draw overlay layer
            L.polygon(maskCoords, {
                color: oceanBlue,     // Border line colour
                weight: 1,
                fillColor: oceanBlue, // Fill colour
                fillOpacity: 1,       // Not opacity
                interactive: false    // Disable mouse interactive
            }).addTo(map);
        })
        .catch(err => {
            console.error("Load error:", err);
            alert("HTTP サーバーから開き、作業フォルダに geojson を配置してください。");
        });

    function addToMask(coordinates, targetArray) {
        const leafCoords = coordinates[0].map(coord => [coord[1], coord[0]]);
        targetArray.push(leafCoords);
    }

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchPanel = document.getElementById('searchPanel');
    const searchToggle = document.getElementById('searchToggle');
    const randomButton = document.getElementById('randomButton');
    const infoPanel = document.getElementById('infoPanel');
    const infoTitle = document.getElementById('infoTitle');
    const infoBody = document.getElementById('infoBody');
    const infoClose = document.getElementById('infoClose');
    const pinMarkers = [];
    let pinData = [];
    const imageFallback = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
            <rect width="640" height="360" rx="24" fill="#dbeafe"/>
            <circle cx="520" cy="92" r="56" fill="#93c5fd" opacity="0.7"/>
            <path d="M72 276 L188 178 L276 244 L354 166 L520 276 Z" fill="#60a5fa" opacity="0.9"/>
            <path d="M110 280 L220 210 L294 258 L384 188 L536 280 Z" fill="#2563eb" opacity="0.45"/>
            <text x="50%" y="54%" text-anchor="middle" font-size="30" font-family="system-ui, sans-serif" fill="#1e3a8a">画像を読み込めません</text>
            <text x="50%" y="63%" text-anchor="middle" font-size="18" font-family="system-ui, sans-serif" fill="#1d4ed8">外部画像の代替表示です</text>
        </svg>
    `);

    function escapeHtml(text) {
        return String(text)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function normalizeKeyword(text) {
        return String(text).trim().toLowerCase().replace(/\s+/g, '');
    }

    function renderSearchResults(results) {
        searchResults.innerHTML = '';

        if (results.length === 0) {
            searchResults.innerHTML = '<p class="results-empty">一致する候補はありません。</p>';
            return;
        }

        results.forEach(pin => {
            const button = document.createElement('button');
            button.type = 'button';
            button.innerHTML = `<strong>${escapeHtml(pin.name)}</strong><span>${escapeHtml(pin.address || '')}</span>`;
            button.addEventListener('click', () => {
                map.setView([pin.pos.lat, pin.pos.lng], 11);
                showPinInfo(pin);
            });
            searchResults.appendChild(button);
        });
    }

    function updateSearch() {
        const keyword = normalizeKeyword(searchInput.value);
        const results = keyword
            ? pinData.filter(pin => normalizeKeyword(pin.name).includes(keyword))
            : pinData;

        pinMarkers.forEach(({ marker, pin }) => {
            if (!keyword || normalizeKeyword(pin.name).includes(keyword)) {
                if (!map.hasLayer(marker)) {
                    marker.addTo(map);
                }
            } else if (map.hasLayer(marker)) {
                map.removeLayer(marker);
            }
        });

        renderSearchResults(results);
    }

    function showPinInfo(pin) {
        infoTitle.textContent = pin.name;
        infoBody.innerHTML = `
            <img class="info-panel-image" src="${escapeHtml(pin.image)}" alt="${escapeHtml(pin.name)}" onerror="this.onerror=null;this.src='${imageFallback}'">
            <p>${escapeHtml(pin.description)}</p>
            <p><strong>住所:</strong> ${escapeHtml(pin.address)}</p>
            <p><a href="${escapeHtml(pin.homepage)}" target="_blank" rel="noopener noreferrer">ホームページを見る</a></p>
        `;
        infoPanel.classList.remove('hidden');
    }

    function hidePinInfo() {
        infoPanel.classList.add('hidden');
    }

    function setSearchPanelVisible(isVisible) {
        searchPanel.classList.toggle('hidden', !isVisible);
        searchToggle.textContent = isVisible ? '検索を隠す' : '検索を表示';
        if (isVisible) {
            searchInput.focus();
        }
    }

    searchToggle.addEventListener('click', () => {
        setSearchPanelVisible(searchPanel.classList.contains('hidden'));
    });

    randomButton.addEventListener('click', () => {
        if (pinData.length === 0) {
            return;
        }

        const randomPin = pinData[Math.floor(Math.random() * pinData.length)];
        map.setView([randomPin.pos.lat, randomPin.pos.lng], 11);
        showPinInfo(randomPin);
    });

    infoClose.addEventListener('click', hidePinInfo);

    searchInput.addEventListener('input', updateSearch);

    fetch('pins.json')
        .then(response => {
            if (!response.ok) throw new Error("pins.json ファイルが見つかりません。");
            return response.json();
        })
        .then(data => {
            pinData = data;

            data.forEach(pin => {
                const marker = L.marker([pin.pos.lat, pin.pos.lng]).addTo(map);
                pinMarkers.push({ pin, marker });

                marker.on('click', () => {
                    map.setView([pin.pos.lat, pin.pos.lng], 11);
                    showPinInfo(pin);
                });
                
            });

            updateSearch();
        })
        .catch(err => {
            console.error("Load error:", err);
            alert("Please access this side from HTTP server and put pins.json in work dir");
        });
</script>
</body>
</html>
